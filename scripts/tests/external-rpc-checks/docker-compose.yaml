name: external-rpc-checks

x-forest-service: &forest-service
  image: ghcr.io/chainsafe/forest:edge-fat
  volumes:
    - node-data:/data
  environment:
    # keeps the database in the container's volume, shared across containers
    - FOREST_PATH=/data
  user: 0:0

services:
  # Resolves yesterday's snapshot, imports it and back-fills the chain index.
  init:
    <<: *forest-service
    volumes:
      - node-data:/data
      - ./init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]

  forest:
    <<: *forest-service
    environment:
      - FOREST_PATH=/data
      - FOREST_CHAIN_INDEXER_ENABLED=1
    ports:
      - "2345:2345"
      - "2346:2346"
    command:
      - --chain=calibnet
      - --encrypt-keystore=false
      - --no-gc
      - --rpc-address=0.0.0.0:2345
      - --healthcheck-address=0.0.0.0:2346
    healthcheck:
      # `/livez` from inside the container: RPC answering and peers connected.
      test:
        [
          "CMD",
          "forest-cli",
          "healthcheck",
          "live",
          "--healthcheck-port",
          "2346",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 5s

  # The image entrypoints into `bundle exec ruby check_rpc.rb`, so only the epochs are appended.
  rpc-checks:
    image: ghcr.io/chainsafe/forest-rpc-checks:latest
    environment:
      FOREST_RPC_URL: forest:2345/rpc/v1

volumes:
  node-data:
