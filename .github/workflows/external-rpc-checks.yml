name: data.riba.plus RPC checks
permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
    inputs:
      forest_image:
        description: "Test this image instead of building one."
        required: false
        type: string
      chain:
        description: "Chains to test."
        required: false
        default: both
        type: choice
        options:
          - both
          - calibnet
          - mainnet
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 13 * * *" # Runs every day at 13:00 UTC

jobs:
  # Runs for a dispatch that names no image, and for `RPC`- or `Release`-labelled pull requests.
  # Skipped for scheduled runs, for a dispatch that names an image, and for unlabelled pull requests.
  build:
    name: Build Forest
    if: |-
      ${{ inputs.forest_image == ''
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && (contains(github.event.pull_request.labels.*.name, 'RPC')
      || contains(github.event.pull_request.labels.*.name, 'Release')))) }}
    runs-on: ubuntu-24.04-arm
    env:
      RUSTC_WRAPPER: sccache
      CC: sccache clang
      CXX: sccache clang++
      AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
    steps:
      - name: Configure SCCache variables
        run: |
          # External PRs do not have access to 'vars' or 'secrets'.
          if [[ "${{secrets.AWS_ACCESS_KEY_ID}}" != "" ]]; then
            {
              echo "SCCACHE_ENDPOINT=${{ vars.SCCACHE_ENDPOINT}}"
              echo "SCCACHE_BUCKET=${{ vars.SCCACHE_BUCKET}}"
              echo "SCCACHE_REGION=${{ vars.SCCACHE_REGION}}"
            } >> "$GITHUB_ENV"
          fi
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        timeout-minutes: 5
        continue-on-error: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.work"
          cache-dependency-path: "**/go.sum"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Install Forest
        env:
          # To minimize compile times: https://nnethercote.github.io/perf-book/build-configuration.html#minimizing-compile-times
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
        run: mise run install --slim quick
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "forest-${{ runner.os }}"
          path: |
            ~/.cargo/bin/forest*
          if-no-files-found: error

  rpc-checks:
    name: RPC checks against the data.riba.plus dataset (${{ matrix.chain }})
    runs-on: warp-ubuntu-2404-arm64-8x
    needs: build
    # `build` only runs for dispatches and labelled pull requests; scheduled runs skip
    # it and test `edge-fat`. Unlabelled pull requests do not run the checks at all.
    if: |-
      ${{ !cancelled()
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'RPC')
      || contains(github.event.pull_request.labels.*.name, 'Release')) }}
    strategy:
      fail-fast: false
      matrix:
        # A dispatch tests the chains it asked for; otherwise mainnet is reserved for scheduled runs and `Release`-labelled pull requests.
        chain: ${{ fromJSON(inputs.chain == 'both' && '["calibnet", "mainnet"]' || inputs.chain != '' && format('["{0}"]', inputs.chain) || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'Release')) && '["calibnet", "mainnet"]' || '["calibnet"]') }}
    env:
      FOREST_CHAIN: ${{ matrix.chain }}
    defaults:
      run:
        working-directory: scripts/tests/external-rpc-checks
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the build
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "forest-${{ runner.os }}"
      - name: Build an image from those binaries
        if: ${{ needs.build.result == 'success' }}
        working-directory: .
        run: |
          docker build --platform linux/arm64 --file scripts/devnet/forest_ci.dockerfile --tag forest-under-test:ci .
          # overwrites the .env FOREST_IMAGE envvar
          echo "FOREST_IMAGE=forest-under-test:ci" >> "$GITHUB_ENV"
      - name: Use the image given to the dispatch
        if: ${{ inputs.forest_image != '' }}
        working-directory: .
        env:
          FOREST_IMAGE_INPUT: ${{ inputs.forest_image }}
        run: |
          echo "FOREST_IMAGE=${FOREST_IMAGE_INPUT}" >> "$GITHUB_ENV"
      - name: Run the RPC checks
        # Mostly buffer around snapshot download, node processing should take ~10 minutes.
        timeout-minutes: 90
        run: ./setup.sh
      - name: Dump docker logs
        if: always()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
      - name: Set WORKFLOW_URL
        if: always()
        run: |
          export WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "${WORKFLOW_URL}"
          echo "WORKFLOW_URL=${WORKFLOW_URL}" >> "$GITHUB_ENV"
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        if: github.ref == 'refs/heads/main' && failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/EXTERNAL_RPC_CHECKS_ISSUE_TEMPLATE.md
