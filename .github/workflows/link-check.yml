name: Link Checker
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "**.mdx"
      - "**.html"
      - ".github/workflows/link-check.yml"
  merge_group:
  pull_request:
    branches:
      - main
    paths:
      - "**.md"
      - "**.mdx"
      - "**.html"
      - ".github/workflows/link-check.yml"

jobs:
  # Merge groups don't support path filters, so detect the relevant changes
  # explicitly and skip the job when nothing relevant changed. Scheduled and
  # manual runs always proceed since they have no diff to filter on.
  # https://github.com/community/community/discussions/45899
  changes:
    runs-on: ubuntu-slim
    outputs:
      changesFound: ${{ steps.filter.outputs.changesFound }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changesFound:
              - '**.md'
              - '**.mdx'
              - '**.html'
              - '.github/workflows/link-check.yml'
  link-check:
    needs: changes
    if: ${{ needs.changes.outputs.changesFound == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    name: Link Check
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --user-agent "curl/8.5.0" --no-progress --config ./.config/lychee.toml './*.md' './AGENTS.md'

      - name: Create Issue From File
        if: env.lychee_exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link Checker Report
          content-filepath: ./lychee-report.md

      - name: Fail job on error
        if: env.lychee_exit_code != 0 && github.event_name != 'schedule'
        run: exit 1
