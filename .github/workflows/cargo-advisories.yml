name: cargo deny advisories
permissions:
  contents: read
  issues: write
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  cargo-deny-advisories:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: cargo binstall --no-confirm cargo-deny
      - run: cargo deny check advisories
      - name: Set WORKFLOW_URL
        if: failure()
        run: |
          export WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "${WORKFLOW_URL}"
          echo "WORKFLOW_URL=${WORKFLOW_URL}" >> "$GITHUB_ENV"
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/CARGO_ADVISORIES_ISSUE_TEMPLATE.md
