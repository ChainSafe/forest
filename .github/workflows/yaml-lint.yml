name: YAML lint
permissions:
  contents: read

# Cancel workflow if there is a new change to the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  merge_group:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml-lint.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml-lint.yml"

jobs:
  # Merge groups don't support path filters, so detect the relevant changes
  # explicitly and skip the job when nothing relevant changed.
  # https://github.com/community/community/discussions/45899
  changes:
    runs-on: ubuntu-slim
    outputs:
      changesFound: ${{ steps.filter.outputs.changesFound }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changesFound:
              - '**/*.yml'
              - '**/*.yaml'
              - '.github/workflows/yaml-lint.yml'
  yaml-lint:
    needs: changes
    if: ${{ needs.changes.outputs.changesFound == 'true' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: mise lint:yaml
