name: Go code linters
permissions:
  contents: read

# Cancel workflow if there is a new change to the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/go-lint.yml"
      - "go.work"
      - "mise.toml"
      - "f3-sidecar/**"
      - "interop-tests/**"
      - "build.rs"
      - "src/f3/go_ffi.rs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/go-lint.yml"
      - "go.work"
      - "mise.toml"
      - "f3-sidecar/**"
      - "interop-tests/**"
      - "build.rs"
      - "src/f3/go_ffi.rs"

jobs:
  # Merge groups don't support path filters, so detect the relevant changes
  # explicitly and skip the lint job when nothing Go-related changed.
  # https://github.com/community/community/discussions/45899
  changes:
    runs-on: ubuntu-slim
    outputs:
      changesFound: ${{ steps.filter.outputs.changesFound }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changesFound:
              - '.github/workflows/go-lint.yml'
              - 'go.work'
              - 'mise.toml'
              - 'f3-sidecar/**'
              - 'interop-tests/**'
              - 'build.rs'
              - 'src/f3/go_ffi.rs'
  lint-go:
    name: Go lint checks
    needs: changes
    if: ${{ needs.changes.outputs.changesFound == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Apt Dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            sudo apt-get install -y libclang-dev # required by rust2go's bindgen
      - run: mise lint:go-ffi
      - run: mise lint:golang
